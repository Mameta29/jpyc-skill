name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The repo is an npm workspace (workspaces: ["mcp-servers/*"]); install
      # and the root scripts both run from the repo root so they resolve
      # against the single root lockfile. `npm install` (not `npm ci`) is
      # used because `npm ci` can skip platform-specific optional deps such
      # as @rollup/rollup-linux-x64-gnu (npm/cli#4828); the lockfile is still
      # honored and committed.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
