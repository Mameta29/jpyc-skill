name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-servers/jpyc-ec-purchase/package-lock.json

      - name: Install
        working-directory: mcp-servers/jpyc-ec-purchase
        run: npm ci

      - name: Typecheck
        working-directory: mcp-servers/jpyc-ec-purchase
        run: npm run typecheck

      - name: Test
        working-directory: mcp-servers/jpyc-ec-purchase
        run: npm test

      - name: Build
        working-directory: mcp-servers/jpyc-ec-purchase
        run: npm run build
