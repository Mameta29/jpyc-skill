name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-servers/jpyc-ec-purchase/package-lock.json
          registry-url: "https://registry.npmjs.org/"

      - name: Install root devDeps (changesets)
        run: npm install --no-save @changesets/cli@^2.27.10

      - name: Install package deps
        working-directory: mcp-servers/jpyc-ec-purchase
        run: npm ci

      - name: Pre-publish build + test
        working-directory: mcp-servers/jpyc-ec-purchase
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
